# One small VPS, one worker container. No Redis, no Kafka, no Kubernetes:
# the durable queue is the adspy_requests table in Supabase Postgres.
#
#   cd D2C
#   cp worker/env.example worker/.env   # fill in the two secrets
#   docker compose -f worker/docker-compose.yml up -d --build
services:
  adspy-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: zooptrack/adspy-worker:latest
    env_file: .env
    restart: unless-stopped          # comes back after crashes and reboots
    init: true                       # reaps zombie Chromium processes
    shm_size: "1gb"                  # real /dev/shm for Chromium
    mem_limit: "3g"
    cpus: 1.5
    pids_limit: 512
    stop_grace_period: 40s           # lets the current job finish its batch
    ports:
      - "127.0.0.1:8787:8787"        # health endpoint, localhost only
    volumes:
      - worker-tmp:/work/tmp         # Chromium profiles; cleaned by the worker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"              # logs can never fill the disk
        max-file: "5"

volumes:
  worker-tmp:
