name: AdSpy nightly pre-fill

# Manual runs only. The founder's Windows PC runs the nightly collector at 01:00 IST
# (scripts/adspy-prefill.ts; Vercel env ADSPY_NIGHTLY_ON_PC=1). A scheduled run here
# is harmful: Meta rate-limits GitHub's IPs after ~30 ads, and the half-finished run
# stamps brands as "recently collected", which then blocks the PC run for 120 hours.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget in minutes"
        default: "300"
      limit:
        description: "Max seed brands (blank = no limit)"
        default: ""
      brands:
        description: "Only these seed brands, comma separated (blank = all)"
        default: ""
      recent_hours:
        description: "Skip brands collected within this many hours (0 = force)"
        default: "120"

concurrency:
  group: adspy-prefill
  cancel-in-progress: false

jobs:
  prefill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Allow server-only modules outside Next.js
        run: |
          mkdir -p node_modules/server-only
          echo '{"name":"server-only","version":"0.0.1","main":"index.js"}' > node_modules/server-only/package.json
          echo "" > node_modules/server-only/index.js

      - name: Collect ads
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADSPY_SYSTEM_USER_ID: ${{ secrets.ADSPY_SYSTEM_USER_ID }}
          # Ad images go to AWS S3 when these are set (Supabase Free = 1 GB only).
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          ADSPY_BROWSER: playwright
          # Meta blocks GitHub's IPs for "load more". Set the repository variable
          # ADSPY_COLLECTOR=searchapi (and the SCRAPECREATORS_API_KEY secret) to
          # collect through ScrapeCreators instead; blank = browser.
          ADSPY_COLLECTOR: ${{ vars.ADSPY_COLLECTOR || '' }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          META_API_PAGES_PER_RUN: "100"
          META_API_MAX_TOTAL_PAGES: "100"
          SEARCHAPI_JOB_BUDGET_MS: "900000"
          ADSPY_DEEP_MAX_SCROLLS: "360"
          # Big advertisers (Kapiva ~1,400 live ads) need ~10 min for a complete live scan.
          ADSPY_WORKER_BUDGET_MS: "900000"
          ADSPY_PREFILL_MINUTES: ${{ github.event.inputs.minutes || '300' }}
          ADSPY_PREFILL_LIMIT: ${{ github.event.inputs.limit || '' }}
          ADSPY_PREFILL_BRANDS: ${{ github.event.inputs.brands || '' }}
          ADSPY_PREFILL_RECENT_HOURS: ${{ github.event.inputs.recent_hours || '120' }}
        run: npx tsx scripts/adspy-prefill.ts
