name: Media prune (keep Supabase storage under 1 GB)

on:
  schedule:
    - cron: "30 9 * * *" # 15:00 IST, well clear of the nightly collector
  workflow_dispatch:

concurrency:
  group: adspy-prefill # never runs at the same time as the collector
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prune old ad images
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/ops/slim-media.ts --apply --stale-days 30 --max-mb 600
