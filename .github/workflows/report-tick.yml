name: report-tick

# Sends rival reports that are due (each user's own day and time, 15-minute steps).
# The route only sends what is due and not yet sent, so extra runs are harmless.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due reports
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          curl -s --max-time 20 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL:-https://www.zooptrack.co.in}/api/cron/weekly-report"; echo
